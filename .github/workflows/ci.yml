name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Base install is pure-Python, so no runner-specific constraints.
        # Java is only needed when actually invoking opendataloader-pdf,
        # which the current unit tests don't do.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with enrich + dev extras
        run: pip install -e ".[enrich,dev]"
      - name: Run tests
        run: pytest -v
