[project]
name = "pdf-toolkit"
version = "0.1.0"
description = "Sample wrapper around opendataloader-pdf for layout-aware PDF extraction, with CLI and FastAPI UI."
requires-python = ">=3.10"
dependencies = [
    "opendataloader-pdf>=2.2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
ocr = ["opendataloader-pdf[hybrid]>=2.2.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pdf-toolkit = "pdf_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
