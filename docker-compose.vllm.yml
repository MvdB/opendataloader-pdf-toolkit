# Optional compose overlay: adds a vLLM service serving an OpenAI-compatible
# chat endpoint for the enrichment layer. Intended for personal / single-GPU
# workstations. Enterprise deployments should point `LLM_BASE_URL` at the
# existing gateway and skip this file entirely.
#
# Usage:
#   VLLM_MODEL=<hf-repo-id-for-gemma-4-e2b-or-e4b> \
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml up --build
#
# Requires the NVIDIA Container Toolkit; adjust the deploy section for other
# accelerators (ROCm, CPU-only).

services:
  vllm:
    # Pinned to a concrete tag because "latest" on vllm/vllm-openai churns
    # frequently and flag compatibility changes between releases. Bump deliberately.
    image: vllm/vllm-openai:v0.19.1
    # Proven flags for Gemma 4 E2B on an 8 GB consumer GPU (tested on RTX 4060):
    #   - bf16 weights (~4 GB) + fp8 KV cache (~40 MB/seq at 4k ctx).
    #   - gpu-memory-utilization 0.85 leaves ~1 GB for the OS / desktop compositor.
    #   - max-model-len 4096 covers typical RAG chunks + prompt + generation.
    #   - enforce-eager disables CUDA graphs; reduces memory, slight perf hit.
    # Override via env for bigger GPUs or different models.
    command:
      - --model
      - ${VLLM_MODEL:?set VLLM_MODEL to the Hugging Face repo id of the model you want served (e.g. google/gemma-4-E2B-it)}
      - --dtype
      - ${VLLM_DTYPE:-bfloat16}
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-4096}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-2}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.85}"
      - --kv-cache-dtype
      - "${VLLM_KV_CACHE_DTYPE:-fp8}"
      - --enforce-eager
      - --trust-remote-code
    expose:
      - "8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()" || exit 1
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 120s

  api:
    environment:
      LLM_BASE_URL: http://vllm:8000/v1
      LLM_API_KEY: EMPTY
      LLM_MODEL: ${VLLM_MODEL}
    depends_on:
      vllm:
        condition: service_healthy
